name: Build raylib - Android

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/**'
      - 'examples/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'examples/**'
      - '.github/workflows/android.yml'
  release:
    types: [published]

permissions:
  contents: write

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        ARCH: ["arm64", "x86_64"]

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Android NDK
      id: setup-ndk
      uses: nttld/setup-ndk@v1
      with:
        ndk-version: r27d
        add-to-path: true

    - name: Setup Environment
      run: |
        RELEASE_NAME="raylib-dev_android_api29_${{ matrix.ARCH }}"
        mkdir -p "build/${RELEASE_NAME}/include"
        mkdir -p "build/${RELEASE_NAME}/lib"
      shell: bash

    - name: Build Library
      run: |
        RELEASE_NAME="raylib-dev_android_api29_${{ matrix.ARCH }}"
        cd src
        make PLATFORM=PLATFORM_ANDROID ANDROID_ARCH=${{ matrix.ARCH }} ANDROID_API_VERSION=29 ANDROID_NDK="${{ steps.setup-ndk.outputs.ndk-path }}" RAYLIB_LIBTYPE=STATIC RAYLIB_RELEASE_PATH="../build/${RELEASE_NAME}/lib"
        make PLATFORM=PLATFORM_ANDROID ANDROID_ARCH=${{ matrix.ARCH }} ANDROID_API_VERSION=29 ANDROID_NDK="${{ steps.setup-ndk.outputs.ndk-path }}" RAYLIB_LIBTYPE=SHARED RAYLIB_RELEASE_PATH="../build/${RELEASE_NAME}/lib" -B
        cd ..
      shell: bash

    - name: Generate Artifacts
      run: |
        RELEASE_NAME="raylib-dev_android_api29_${{ matrix.ARCH }}"
        cp -v ./src/raylib.h ./build/${RELEASE_NAME}/include/
        cp -v ./src/raymath.h ./build/${RELEASE_NAME}/include/
        cp -v ./src/rlgl.h ./build/${RELEASE_NAME}/include/
        cp -v ./CHANGELOG ./build/${RELEASE_NAME}/ || true
        cp -v ./README.md ./build/${RELEASE_NAME}/ || true
        cp -v ./LICENSE ./build/${RELEASE_NAME}/ || true
      shell: bash

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: raylib-dev_android_api29_${{ matrix.ARCH }}
        path: ./build/raylib-dev_android_api29_${{ matrix.ARCH }}

    - name: Upload Artifact to Release
      uses: softprops/action-gh-release@v2
      if: github.event_name == 'release' && github.event.action == 'published'
      with:
        files: ./build/raylib-dev_android_api29_${{ matrix.ARCH }}/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
